<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Dúvidas, sugestões e solicitações para a equipe de SMS da Priner.">

<!-- Pré-visualização ao compartilhar o link (WhatsApp, Teams, LinkedIn).
     ATENÇÃO: og:url e og:image precisam ser URLs absolutas — scrapers não resolvem
     caminho relativo. Ao publicar em outro domínio, trocar https://canal-sms-modec.pages.dev em todas as páginas. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Canal SMS Modec">
<meta property="og:locale" content="pt_BR">
<meta property="og:url" content="https://canal-sms-modec.pages.dev/atendimento.html">
<meta property="og:title" content="Falar com o SMS Priner — Canal SMS">
<meta property="og:description" content="Dúvidas, sugestões e solicitações para a equipe de SMS da Priner.">
<meta property="og:image" content="https://canal-sms-modec.pages.dev/assets/img/og-canal-sms.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Canal SMS Modec">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex">
<title>Falar com o SMS Priner - Canal SMS</title>
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#0B514F">
<link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body>

<header class="topo">
  <div class="container">
    <a class="marca" href="index.html">
      <img class="marca__logo" src="assets/img/Logo_Priner_RGB-02.png"
           data-cfg-src="logo.url" alt="Priner" width="240" height="57">
      <span class="marca__nome">Canal <span class="grifo">SMS</span></span>
    </a>
  </div>
</header>

<main class="container">

  <a class="voltar" href="index.html">&lsaquo; Voltar ao menu</a>

  <div class="conteudo">
    <h1>Falar com o SMS Priner</h1>
    <p class="chamada">Dúvidas, sugestões e solicitações. Informe os dados abaixo para a equipe já chegar na conversa sabendo quem é você.</p>
  </div>

  <form class="painel"
        data-caminho="ATENDIMENTO"
        data-wa-destino="sms"
        data-abertura="[CANAL SMS] Solicitação de atendimento"
        novalidate>

    <div class="campo">
      <label for="nome">Seu nome completo</label>
      <input id="nome" type="text" autocomplete="name" required
             data-campo="nome" data-rotulo="Nome">
    </div>

    <div class="campo">
      <label for="matricula">Matrícula</label>
      <input id="matricula" type="text" inputmode="numeric" required
             data-campo="matricula" data-rotulo="Matrícula">
    </div>

    <div class="campo">
      <label for="setor">Setor ou função</label>
      <input id="setor" type="text" required
             data-campo="setor" data-rotulo="Setor">
    </div>

    <div class="campo">
      <label for="assunto">Assunto
        <span class="ajuda">Em uma frase, o que você precisa</span>
      </label>
      <textarea id="assunto" required
                data-campo="assunto" data-rotulo="Assunto"></textarea>
    </div>

    <button class="botao" type="submit">Registrar e falar no WhatsApp</button>
    <p class="status" role="status" aria-live="polite"></p>
  </form>


</main>

<footer class="rodape">
  <div class="container">
    <p><strong>Atendimento:</strong> <span data-cfg="janelaAtendimento">&nbsp;</span></p>
    <p>Fora desse horário sua mensagem fica registrada e é respondida no próximo dia útil.</p>
    <p>Priner · Canal SMS · versão <span data-cfg="versao">&nbsp;</span></p>
  </div>
</footer>

<script src="assets/js/portal.js"></script>
</body>
</html>
